{{- define "title" }}{{ .Title }} - {{ .Site.Title }}{{ end -}}

{{- define "content" }}
<div class="content-wrapper">
  <div id="content" class="content">

    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
    </header>

    <div class="post-content red-root">
      {{ partial "red-assets.html" (dict "page" .) }}
      {{ .Content }}

      <div class="red-index">
        {{- range .Pages.ByWeight }}
        <a class="red-card" href="{{ .RelPermalink }}">
          <h3>{{ .Title }}</h3>
          <p>{{ .Summary }}</p>
        </a>
        {{- end }}
      </div>
    </div>

  </div>
</div>
{{- end }}
